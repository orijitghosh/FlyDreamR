url: https://orijitghosh.github.io/FlyDreamR/

template:
  bootstrap: 5
  bootswatch: zephyr
  light-switch: true
  theme: ayu-light
  theme-dark: ayu-dark
  params:
    logo: vignettes/FlyDreamR_logo.png

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: "Overview"
      href: articles/introduction.html
    github:
      icon: fab fa-github
      href: https://github.com/orijitghosh/FlyDreamR
      aria-label: GitHub

articles:
  - title: Get started
    navbar: ~
    contents:
      - introduction

  - title: Workflows
    navbar: ~
    contents:
      - data-prep
      - traditional-sleep
      - hmm-workflow
      - shiny-app

reference:
  - title: "Metadata & Data Import"
    desc: >
      Convert raw master files into the metadata format required
      to link experimental conditions with monitor files.
    contents:
      - convMasterToMeta
      - convMasterToMetaBatch

  - title: "Data Preparation"
    desc: >
      Load DAM activity data, link it with metadata, and calculate
      normalized activity, day number, and light/dark phase.
    contents:
      - HMMDataPrep

  - title: "HMM Analysis"
    desc: >
      Fit hidden Markov models to infer sleep and wake states from
      activity counts, serially or in parallel.
    contents:
      - HMMbehavr
      - HMMbehavrFast

  - title: "Visualization"
    desc: >
      Plot inferred states as heatmap hypnograms, faceted group profiles,
      or individual daily profiles.
    contents:
      - HMMplot
      - HMMFacetedPlot
      - HMMSinglePlot

  - title: "Traditional Sleep Metrics"
    desc: >
      Calculate standard immobility-based sleep metrics for comparison
      with HMM results.
    contents:
      - calcTradSleep

  - title: "Shiny App"
    desc: >
      Launch the interactive GUI for point-and-click analysis.
    contents:
      - runFlyDreamRApp
